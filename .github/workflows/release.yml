name: Release FileMind APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cpp:
    name: C++ gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: CTest
        run: cmake --build build --parallel 2 && ctest --test-dir build --output-on-failure

  android:
    name: Android APK gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p FileMind --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s FileMind/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FileMind-release-${{ github.ref_name }}
          path: FileMind/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [cpp, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: FileMind-release-${{ github.ref_name }}
          path: release
      - name: Publish release and APK asset
        uses: softprops/action-gh-release@v2
        with:
          name: FileMind ${{ github.ref_name }}
          generate_release_notes: true
          files: release/app-debug.apk
          fail_on_unmatched_files: true
